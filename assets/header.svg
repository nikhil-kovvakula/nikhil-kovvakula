<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="100%" role="img" aria-label="Kovvakula Nikhil - AI and ML Engineer">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="55%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#0ea5e9" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.22" />
    </linearGradient>
    <radialGradient id="glowLeft" cx="20%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowRight" cx="85%" cy="60%" r="40%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.6" />
    </pattern>
  </defs>

  <!-- Base & Grid -->
  <rect width="1200" height="260" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="260" rx="16" fill="url(#grid)" />
  <rect width="1200" height="260" rx="16" fill="url(#glowLeft)" />
  <rect width="1200" height="260" rx="16" fill="url(#glowRight)" />

  <!-- Decorative Neural Graph (Right & Left) -->
  <g stroke="#00f2fe" stroke-opacity="0.25" stroke-width="1.2">
    <line x1="90" y1="60" x2="175" y2="115" />
    <line x1="90" y1="60" x2="145" y2="175" />
    <line x1="175" y1="115" x2="145" y2="175" />
    <line x1="175" y1="115" x2="250" y2="75" />
    <line x1="970" y1="65" x2="1055" y2="120" />
    <line x1="1055" y1="120" x2="1125" y2="70" />
    <line x1="1055" y1="120" x2="1015" y2="195" />
    <line x1="1015" y1="195" x2="1120" y2="175" />
    <line x1="1125" y1="70" x2="1120" y2="175" />
  </g>
  <g fill="#00f2fe">
    <circle cx="90" cy="60" r="3.5" opacity="0.65" />
    <circle cx="175" cy="115" r="4.5" opacity="0.85">
      <animate attributeName="r" values="4.5;6.5;4.5" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="145" cy="175" r="3" opacity="0.55" />
    <circle cx="250" cy="75" r="3" opacity="0.5" />
    <circle cx="970" cy="65" r="3.5" opacity="0.6" />
    <circle cx="1055" cy="120" r="5" opacity="0.9">
      <animate attributeName="r" values="5;7;5" dur="2.6s" repeatCount="indefinite" />
    </circle>
    <circle cx="1125" cy="70" r="3.5" opacity="0.7" />
    <circle cx="1015" cy="195" r="3" opacity="0.55" />
    <circle cx="1120" cy="175" r="4" opacity="0.75" />
  </g>

  <!-- Subtle Bottom Wave -->
  <path d="M0,210 C220,175 420,240 640,210 C860,180 1030,235 1200,200 L1200,260 L0,260 Z" fill="url(#waveGrad)" />

  <!-- Top Status Pill -->
  <rect x="462" y="34" width="276" height="28" rx="14" fill="#0f172a" stroke="#0e7490" stroke-width="1.2" />
  <circle cx="484" cy="48" r="4.5" fill="#22c55e">
    <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite" />
  </circle>
  <text x="606" y="52.5" text-anchor="middle" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" letter-spacing="0.8">
    OPEN TO AI/ML &amp; SWE ROLES
  </text>

  <!-- Main Name -->
  <text x="600" y="128" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="-0.5">
    Kovvakula <tspan fill="url(#accentGrad)">Nikhil</tspan>
  </text>

  <!-- Subtitle -->
  <text x="600" y="168" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18.5" font-weight="500" letter-spacing="0.4">
    AI &amp; ML Engineer  •  Full-Stack Builder  •  Competitive Programmer
  </text>

  <!-- Bottom Tech Accent Line -->
  <rect x="480" y="192" width="240" height="3" rx="1.5" fill="url(#accentGrad)" opacity="0.85" />

  <!-- Outer Border -->
  <rect x="1" y="1" width="1198" height="258" rx="15" fill="none" stroke="#0e7490" stroke-opacity="0.6" stroke-width="1.5" />
</svg>
